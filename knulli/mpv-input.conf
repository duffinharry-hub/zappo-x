# Zappo X: keys for Knulli's mpv (films from the Videos tab), for a keyboard
# if one is plugged in. The handheld's buttons come through
# "zappo-x --mpv-remote" instead (A pause, B back, left/right 10 s, up/down
# a minute, L1/R1 previous/next film, SELECT how far, X audio, Y subtitles).
SPACE  cycle pause
ENTER  cycle pause
ESC    quit-watch-later
BS     quit-watch-later
LEFT   seek -10
RIGHT  seek 10
UP     seek 60
DOWN   seek -60
