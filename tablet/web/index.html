<style>
/* One look on purpose: a dark handheld on a dark desk, whatever the viewer's theme. */
:root {
  color-scheme: dark;

  --body: #1d1f27; --body-edge: #2c2f3a; --body-hi: #34384a;
  --key: #12131a; --key-hi: #20222c; --key-txt: #8d93a8;
  --ink: #e9ecf5; --ink-dim: #9aa1b8; --gold: #f5c842;
  --ring: #f5c842;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: radial-gradient(120% 90% at 50% 0%, var(--desk2), var(--desk)); color: var(--ink);
  font: 15px/1.45 Figtree, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; gap: 12px; height: 46px; flex-wrap: nowrap; }
.brand { font: 600 19px Fredoka, Figtree, sans-serif; letter-spacing: .3px; white-space: nowrap; }
.brand b { color: var(--gold); font-weight: 600; }
.chip { font: 500 12px "JetBrains Mono", ui-monospace, monospace; color: var(--ink-dim); background: #ffffff0d; border: 1px solid #ffffff14;
  padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.spacer { flex: 1; min-width: 0; }
.tbtn { font: 600 13px Figtree, sans-serif; color: var(--ink); background: #ffffff12; border: 1px solid #ffffff1f; border-radius: 10px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.tbtn:active { background: #ffffff26; }
#stage { position: relative; height: calc(100% - 46px - 8px); display: grid; place-items: center; }
#dev { position: absolute; left: 50%; top: 50%; width: 1064px; height: 500px; transform-origin: 0 0; }
canvas#screen { position: absolute; left: 212px; top: 10px; width: 640px; height: 480px; background: #000; border-radius: 10px;
  box-shadow: 0 0 0 1px #ffffff14, 0 18px 50px #000c; }
.key { position: absolute; display: grid; place-items: center; background: var(--key); color: var(--key-txt); font: 700 15px Figtree, sans-serif;
  box-shadow: inset 0 -3px 0 #00000080, inset 0 1px 0 #ffffff14; cursor: pointer; touch-action: none; }
.key.on { background: var(--key-hi); color: var(--ink); transform: translateY(1px); }
.round { width: 52px; height: 52px; border-radius: 50%; font-size: 17px; }
.pill { width: 62px; height: 22px; border-radius: 11px; font-size: 10px; letter-spacing: 1px; }
.shoulder { height: 34px; width: 88px; border-radius: 14px 14px 8px 8px; font-size: 12px; top: 8px; }
.dpad { position: absolute; left: 34px; top: 76px; width: 140px; height: 140px; }
.dpad .key { width: 46px; height: 48px; border-radius: 8px; }
.ring { position: absolute; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; overflow: visible; }
.ovl { position: absolute; left: 212px; top: 10px; width: 640px; height: 480px; display: grid; place-items: center; background: #090b12f0;
  border-radius: 10px; text-align: center; padding: 28px; }
.ovl h2 { font: 600 26px Fredoka, sans-serif; margin: 0 0 8px; }
.ovl p { color: var(--ink-dim); margin: 6px 0; font-size: 16px; }
.ovl .go { margin-top: 18px; font: 700 16px Figtree, sans-serif; color: #1a1407; background: var(--gold); border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
.ovl video { width: 100%; max-height: 330px; border-radius: 10px; background: #000; }
.ovl code { font: 500 12px "JetBrains Mono", monospace; color: #c9cfe6; word-break: break-all; }
.ovl .bar { width: 260px; height: 6px; background: #ffffff14; border-radius: 3px; overflow: hidden; margin: 14px auto 0; }
.ovl .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
#turn { display: none; position: fixed; inset: 46px 0 0; place-items: center; text-align: center; color: var(--ink-dim); padding: 24px; }
@media (orientation: portrait) and (max-width: 820px) { #turn { display: grid; } #stage { visibility: hidden; } }
@media (display-mode: fullscreen), (display-mode: standalone) { #full, #install { display: none; } }
/* a controller connected: just the screen, as big as it goes (touching the
   screen brings the on-screen buttons back; the controller hides them again) */
body.padmode { padding: 0; background: #000; }
body.padmode .top { display: none; }
body.padmode #stage { height: 100%; }
body.padmode #dev { width: 640px; height: 480px; }
body.padmode #dev > :not(#screen):not(#ovl) { display: none; }
body.padmode canvas#screen, body.padmode .ovl { left: 0; top: 0; border-radius: 0; box-shadow: none; }

<script>
window.ZAPPO_NATIVE = true;
/* Zappo X in the browser: the runtime around zappo.wasm.
 *
 *  - a small in-memory file system (the kit's themes, fonts and art, plus a
 *    few test files) behind the WASI calls the C library makes;
 *  - the "zappo" imports: draw the 640x480 picture, the clock, battery,
 *    brightness, the sound (Web Audio) and what a game launch would start.
 *
 * Plain script, no libraries.  Exposes window.ZappoRuntime. */
(function () {
  "use strict";

  /* ------------------------------------------------------------ files */

  const DIR = 3, FILE = 4;
  let inoNext = 10;

  function mkdir() { return { type: DIR, ino: inoNext++, kids: new Map(), mtime: Date.now() }; }
  function mkfile(data) { return { type: FILE, ino: inoNext++, data: data || new Uint8Array(0), size: data ? data.length : 0, mtime: Date.now() }; }

  class MemFS {
    constructor() { this.root = mkdir(); this.changed = new Set(); }
    split(path) { return path.split("/").filter(p => p && p !== "."); }
    lookup(path, from) {
      let node = from || this.root;
      const stack = [];
      for (const part of this.split(path)) {
        if (part === "..") { node = stack.length ? stack.pop() : this.root; continue; }
        if (node.type !== DIR) return null;
        const next = node.kids.get(part);
        if (!next) return null;
        stack.push(node);
        node = next;
      }
      return node;
    }
    parentOf(path, from) {
      const parts = this.split(path);
      const name = parts.pop();
      const dir = parts.length ? this.lookup(parts.join("/"), from) : (from || this.root);
      return { dir, name };
    }
    mkdirp(path) {
      let node = this.root;
      for (const part of this.split(path)) {
        let next = node.kids.get(part);
        if (!next) { next = mkdir(); node.kids.set(part, next); }
        node = next;
      }
      return node;
    }
    writeFile(path, bytes) {
      const parts = this.split(path);
      const name = parts.pop();
      const dir = this.mkdirp(parts.join("/"));
      const f = mkfile(bytes);
      dir.kids.set(name, f);
      return f;
    }
    readFile(path) {
      const n = this.lookup(path);
      return n && n.type === FILE ? n.data.subarray(0, n.size) : null;
    }
    absPath(node, target = this.root, prefix = "") {
      if (target === node) return prefix || "/";
      if (target.type !== DIR) return null;
      for (const [k, v] of target.kids) {
        const r = this.absPath(node, v, prefix + "/" + k);
        if (r) return r;
      }
      return null;
    }
  }

  /* ------------------------------------------------------------- WASI */

  const E = { OK: 0, ACCES: 2, BADF: 8, EXIST: 20, INVAL: 28, ISDIR: 31, NOENT: 44, NOSYS: 52, NOTDIR: 54, NOTEMPTY: 55, SPIPE: 70 };
  const ALL = 0xffffffffffffffffn;

  class ExitStatus extends Error { constructor(code) { super("exit " + code); this.code = code; } }

  function makeWasi(fs, getMem, log) {
    const fds = new Map();
    fds.set(0, { kind: "tty" });
    fds.set(1, { kind: "tty", out: "log" });
    fds.set(2, { kind: "tty", out: "err" });
    fds.set(3, { kind: "node", node: fs.root, pre: "/", pos: 0 });
    let nextFd = 4;
    const tdec = new TextDecoder();
    const tenc = new TextEncoder();
    const view = () => new DataView(getMem().buffer);
    const bytes = () => new Uint8Array(getMem().buffer);
    const str = (p, n) => tdec.decode(bytes().slice(p, p + n));
    const lines = { log: "", err: "" };

    function fdNode(fd) { const f = fds.get(fd); return f && f.kind === "node" ? f : null; }
    function grow(node, need) {
      if (need <= node.data.length) return;
      let cap = Math.max(need, node.data.length * 2, 4096);
      const d = new Uint8Array(cap);
      d.set(node.data.subarray(0, node.size));
      node.data = d;
    }
    function stat(ptr, node) {
      const v = view();
      v.setBigUint64(ptr, 1n, true);
      v.setBigUint64(ptr + 8, BigInt(node.ino), true);
      v.setUint8(ptr + 16, node.type);
      v.setBigUint64(ptr + 24, 1n, true);
      v.setBigUint64(ptr + 32, BigInt(node.type === FILE ? node.size : 4096), true);
      const t = BigInt(Math.floor(node.mtime)) * 1000000n;
      v.setBigUint64(ptr + 40, t, true);
      v.setBigUint64(ptr + 48, t, true);
      v.setBigUint64(ptr + 56, t, true);
    }
    function markChanged(f) {
      if (!f || !f.node) return;
      const p = fs.absPath(f.node);
      if (p) fs.changed.add(p);
    }

    const api = {
      args_get: () => E.OK,
      args_sizes_get: (argc, size) => { view().setUint32(argc, 0, true); view().setUint32(size, 0, true); return E.OK; },
      environ_get: () => E.OK,
      environ_sizes_get: (c, s) => { view().setUint32(c, 0, true); view().setUint32(s, 0, true); return E.OK; },
      clock_res_get: (id, out) => { view().setBigUint64(out, 1000n, true); return E.OK; },
      clock_time_get: (id, prec, out) => {
        const ns = id === 0 ? BigInt(Date.now()) * 1000000n : BigInt(Math.floor(performance.now() * 1e6));
        view().setBigUint64(out, ns, true);
        return E.OK;
      },
      fd_advise: () => E.OK,
      fd_allocate: () => E.OK,
      fd_datasync: () => E.OK,
      fd_sync: () => E.OK,
      fd_close: (fd) => {
        const f = fds.get(fd);
        if (!f) return E.BADF;
        if (f.dirty) markChanged(f);
        if (fd > 3) fds.delete(fd);
        return E.OK;
      },
      fd_fdstat_get: (fd, out) => {
        const f = fds.get(fd);
        if (!f) return E.BADF;
        const v = view();
        v.setUint8(out, f.kind === "tty" ? 2 : f.node.type);
        v.setUint16(out + 2, f.append ? 1 : 0, true);
        v.setBigUint64(out + 8, ALL, true);
        v.setBigUint64(out + 16, ALL, true);
        return E.OK;
      },
      fd_fdstat_set_flags: (fd, flags) => { const f = fds.get(fd); if (!f) return E.BADF; f.append = !!(flags & 1); return E.OK; },
      fd_fdstat_set_rights: () => E.OK,
      fd_filestat_get: (fd, out) => {
        const f = fds.get(fd);
        if (!f) return E.BADF;
        if (f.kind === "tty") { stat(out, { ino: fd, type: 2, size: 0, mtime: 0 }); return E.OK; }
        stat(out, f.node);
        return E.OK;
      },
      fd_filestat_set_size: (fd, size) => {
        const f = fdNode(fd);
        if (!f || f.node.type !== FILE) return E.BADF;
        const n = Number(size);
        grow(f.node, n);
        if (n > f.node.size) f.node.data.fill(0, f.node.size, n);
        f.node.size = n;
        f.dirty = true;
        return E.OK;
      },
      fd_filestat_set_times: () => E.OK,
      fd_prestat_get: (fd, out) => {
        const f = fds.get(fd);
        if (!f || !f.pre) return E.BADF;
        view().setUint8(out, 0);
        view().setUint32(out + 4, tenc.encode(f.pre).length, true);
        return E.OK;
      },
      fd_prestat_dir_name: (fd, p, n) => {
        const f = fds.get(fd);
        if (!f || !f.pre) return E.BADF;
        bytes().set(tenc.encode(f.pre).subarray(0, n), p);
        return E.OK;
      },
      fd_read: (fd, iovs, n, outp) => {
        const f = fdNode(fd);
        if (!f) { view().setUint32(outp, 0, true); return fd === 0 ? E.OK : E.BADF; }
        if (f.node.type !== FILE) return E.ISDIR;
        let total = 0;
        const v = view();
        for (let i = 0; i < n; i++) {
          const p = v.getUint32(iovs + i * 8, true), len = v.getUint32(iovs + i * 8 + 4, true);
          const avail = Math.max(0, Math.min(len, f.node.size - f.pos));
          bytes().set(f.node.data.subarray(f.pos, f.pos + avail), p);
          f.pos += avail;
          total += avail;
          if (avail < len) break;
        }
        view().setUint32(outp, total, true);
        return E.OK;
      },
      fd_pread: (fd, iovs, n, off, outp) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const save = f.pos;
        f.pos = Number(off);
        const r = api.fd_read(fd, iovs, n, outp);
        f.pos = save;
        return r;
      },
      fd_write: (fd, iovs, n, outp) => {
        const v = view();
        const f = fds.get(fd);
        if (!f) return E.BADF;
        let total = 0;
        for (let i = 0; i < n; i++) {
          const p = v.getUint32(iovs + i * 8, true), len = v.getUint32(iovs + i * 8 + 4, true);
          if (f.kind === "tty") {
            lines[f.out || "log"] += str(p, len);
            let k;
            while ((k = lines[f.out || "log"].indexOf("\n")) >= 0) {
              log(lines[f.out || "log"].slice(0, k), f.out === "err");
              lines[f.out || "log"] = lines[f.out || "log"].slice(k + 1);
            }
          } else {
            const node = f.node;
            if (node.type !== FILE) return E.ISDIR;
            if (f.append) f.pos = node.size;
            grow(node, f.pos + len);
            node.data.set(bytes().subarray(p, p + len), f.pos);
            f.pos += len;
            if (f.pos > node.size) node.size = f.pos;
            node.mtime = Date.now();
            f.dirty = true;
          }
          total += len;
        }
        v.setUint32(outp, total, true);
        return E.OK;
      },
      fd_pwrite: (fd, iovs, n, off, outp) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const save = f.pos;
        f.pos = Number(off);
        const r = api.fd_write(fd, iovs, n, outp);
        f.pos = save;
        return r;
      },
      fd_seek: (fd, off, whence, outp) => {
        const f = fdNode(fd);
        if (!f) return E.SPIPE;
        const o = Number(off);
        const base = whence === 0 ? 0 : whence === 1 ? f.pos : f.node.size;
        const np = base + o;
        if (np < 0) return E.INVAL;
        f.pos = np;
        view().setBigUint64(outp, BigInt(np), true);
        return E.OK;
      },
      fd_tell: (fd, outp) => { const f = fdNode(fd); if (!f) return E.SPIPE; view().setBigUint64(outp, BigInt(f.pos), true); return E.OK; },
      fd_readdir: (fd, buf, len, cookie, outp) => {
        const f = fdNode(fd);
        if (!f || f.node.type !== DIR) return E.NOTDIR;
        const names = [".", "..", ...f.node.kids.keys()];
        const v = view(), b = bytes();
        let used = 0;
        for (let i = Number(cookie); i < names.length; i++) {
          const name = tenc.encode(names[i]);
          const kid = i < 2 ? f.node : f.node.kids.get(names[i]);
          const ent = new Uint8Array(24 + name.length);
          const dv = new DataView(ent.buffer);
          dv.setBigUint64(0, BigInt(i + 1), true);
          dv.setBigUint64(8, BigInt(kid.ino), true);
          dv.setUint32(16, name.length, true);
          dv.setUint8(20, kid.type);
          ent.set(name, 24);
          const take = Math.min(ent.length, len - used);
          b.set(ent.subarray(0, take), buf + used);
          used += take;
          if (used >= len) break;
        }
        v.setUint32(outp, used, true);
        return E.OK;
      },
      fd_renumber: () => E.NOSYS,
      path_create_directory: (fd, p, n) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const { dir, name } = fs.parentOf(str(p, n), f.node);
        if (!dir || dir.type !== DIR) return E.NOENT;
        if (dir.kids.has(name)) return E.EXIST;
        dir.kids.set(name, mkdir());
        return E.OK;
      },
      path_filestat_get: (fd, flags, p, n, out) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const node = fs.lookup(str(p, n), f.node);
        if (!node) return E.NOENT;
        stat(out, node);
        return E.OK;
      },
      path_filestat_set_times: () => E.OK,
      path_link: () => E.NOSYS,
      path_readlink: () => E.INVAL,
      path_symlink: () => E.NOSYS,
      path_open: (fd, dirflags, p, n, oflags, rb, ri, fdflags, outp) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const path = str(p, n);
        let node = fs.lookup(path, f.node);
        if (node && (oflags & 4)) return E.EXIST;               /* EXCL */
        if (!node) {
          if (!(oflags & 1)) return E.NOENT;                     /* CREAT */
          const { dir, name } = fs.parentOf(path, f.node);
          if (!dir || dir.type !== DIR || !name) return E.NOENT;
          node = mkfile();
          dir.kids.set(name, node);
        }
        if ((oflags & 2) && node.type !== DIR) return E.NOTDIR;  /* DIRECTORY */
        if (oflags & 8) { if (node.type !== FILE) return E.ISDIR; node.size = 0; node.mtime = Date.now(); } /* TRUNC */
        const nf = { kind: "node", node, pos: 0, append: !!(fdflags & 1), dirty: !!(oflags & 9) };
        const id = nextFd++;
        fds.set(id, nf);
        view().setUint32(outp, id, true);
        return E.OK;
      },
      path_remove_directory: (fd, p, n) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const { dir, name } = fs.parentOf(str(p, n), f.node);
        const node = dir && dir.kids.get(name);
        if (!node) return E.NOENT;
        if (node.type !== DIR) return E.NOTDIR;
        if (node.kids.size) return E.NOTEMPTY;
        dir.kids.delete(name);
        return E.OK;
      },
      path_rename: (fd, p, n, fd2, p2, n2) => {
        const a = fdNode(fd), b = fdNode(fd2);
        if (!a || !b) return E.BADF;
        const src = fs.parentOf(str(p, n), a.node), dst = fs.parentOf(str(p2, n2), b.node);
        const node = src.dir && src.dir.kids.get(src.name);
        if (!node) return E.NOENT;
        if (!dst.dir || dst.dir.type !== DIR) return E.NOENT;
        src.dir.kids.delete(src.name);
        dst.dir.kids.set(dst.name, node);
        const ap = fs.absPath(node);
        if (ap) fs.changed.add(ap);
        return E.OK;
      },
      path_unlink_file: (fd, p, n) => {
        const f = fdNode(fd);
        if (!f) return E.BADF;
        const path = str(p, n);
        const { dir, name } = fs.parentOf(path, f.node);
        const node = dir && dir.kids.get(name);
        if (!node) return E.NOENT;
        if (node.type === DIR) return E.ISDIR;
        dir.kids.delete(name);
        return E.OK;

        launch: (p, n) => { this.launched = dec.decode(u8().slice(p, p + n)); },

  /* ------------------------------------------------------- the card */

  async function loadCard(onProgress) {

    constructor(cv) {
      const gl = cv.getContext("webgl", { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: true, powerPreference: "high-performance" });
      if (!gl) throw new Error("no WebGL");
      this.gl = gl;
      const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;attribute vec2 t;attribute vec4 c;varying vec2 vt;varying vec4 vc;" +
        "void main(){vt=t;vc=c;gl_Position=vec4(p.x/320.0-1.0,1.0-p.y/240.0,0.0,1.0);}"));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, "precision mediump float;uniform sampler2D s;uniform float w;varying vec2 vt;varying vec4 vc;" +
        "void main(){vec4 x=texture2D(s,vt);if(w>0.5)x=x.bgra;gl_FragColor=x*vc;}"));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      gl.useProgram(pr);
      this.uW = gl.getUniformLocation(pr, "w");
      const MAXQ = 300;
      this.v = new Float32Array(MAXQ * 32);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, this.v.byteLength, gl.DYNAMIC_DRAW);
      const idx = new Uint16Array(MAXQ * 6);
      for (let i = 0; i < MAXQ; i++) idx.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3], i * 6);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
      [["p", 2, 0], ["t", 2, 8], ["c", 4, 16]].forEach(([n, k, off]) => { const l = gl.getAttribLocation(pr, n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, k, gl.FLOAT, false, 32, off); });
      this.tPlain = this.tex(gl.RGB, gl.UNSIGNED_SHORT_5_6_5, 640, 480, gl.NEAREST);
      this.tBg = this.tex(gl.RGB, gl.UNSIGNED_SHORT_5_6_5, 640, 480, gl.NEAREST);
      this.tMenu = this.tex(gl.RGBA, gl.UNSIGNED_BYTE, 640, 480, gl.NEAREST);
      this.tAtlas = null; this.uv = null; this.q = new Float32Array(0); this.layers = 0;
    }
    tex(fmt, type, w, h, filter, data = null) {
      const gl = this.gl, t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, filter], [gl.TEXTURE_MAG_FILTER, filter], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, fmt, type, data);
      return t;
    }
    rows(t, buf, head, bpp) {	/* rows y0..y1 straight onto the GPU */
      const gl = this.gl, dv = new DataView(buf), y0 = dv.getUint16(head - 4, true), y1 = dv.getUint16(head - 2, true), n = (y1 - y0 + 1) * 640;
      gl.bindTexture(gl.TEXTURE_2D, t);
      if (bpp === 2) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, y0, 640, y1 - y0 + 1, gl.RGB, gl.UNSIGNED_SHORT_5_6_5, new Uint16Array(buf, head, n));
      else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, y0, 640, y1 - y0 + 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(buf, head, n * 4));
    }
    message(buf) {
      const k = new Uint8Array(buf, 0, 1)[0];
      if (k === 71) this.rows(this.tPlain, buf, 6, 2);       /* G */
      else if (k === 66) this.rows(this.tBg, buf, 6, 2);     /* B */
      else if (k === 77) this.rows(this.tMenu, buf, 8, 4);   /* M */
      else if (k === 80) this.q = new Float32Array(buf, 4, new DataView(buf).getUint16(2, true) * 8);	/* P */
      else if (k === 83) {                                    /* S */
        const dv = new DataView(buf), aw = dv.getUint16(2, true), ah = dv.getUint16(4, true), n = dv.getUint8(6);
        this.uv = new Float32Array(buf.slice(8, 8 + n * 16));
        if (this.tAtlas) this.gl.deleteTexture(this.tAtlas);
        this.tAtlas = this.tex(this.gl.RGBA, this.gl.UNSIGNED_BYTE, aw, ah, this.gl.LINEAR, new Uint8Array(buf, 8 + n * 16, aw * ah * 4));
      }
    }
    put(i, x0, y0, x1, y1, u0, v0, u1, v1) {	/* a plain rectangle */
      this.v.set([x0, y0, u0, v0, 1, 1, 1, 1, x1, y0, u1, v0, 1, 1, 1, 1, x1, y1, u1, v1, 1, 1, 1, 1, x0, y1, u0, v1, 1, 1, 1, 1], i * 32);
    }
    full(t, swz, blend) {
      const gl = this.gl;
      this.put(0, 0, 0, 640, 480, 0, 0, 1, 1);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.v.subarray(0, 32));
      if (blend) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); } else gl.disable(gl.BLEND);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.uniform1f(this.uW, swz);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    }
    particles() {
      const gl = this.gl, q = this.q, uv = this.uv, v = this.v;
      if (!this.tAtlas || !uv || !q.length) return;
      let nq = 0, nNormal = 0;
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i + 8 <= q.length && nq < 299; i += 8) {
          const sp = q[i + 7] | 0, glow = sp >= 256 ? 1 : 0;
          if (glow !== pass) continue;
          const s4 = (sp & 255) * 4, ux = uv[s4], uy = uv[s4 + 1], uw = uv[s4 + 2], uh = uv[s4 + 3];
          const x = q[i], y = q[i + 1], hw = q[i + 2] / 2, hh = q[i + 3] / 2, a = q[i + 4] * 0.017453293, c = Math.cos(a), sn = Math.sin(a);
          const t = q[i + 6] | 0, r = ((t >> 16) & 255) / 255, g = ((t >> 8) & 255) / 255, b = (t & 255) / 255, al = q[i + 5];
          const o = nq * 32;
          const CX = [-1, 1, 1, -1], CY = [-1, -1, 1, 1];
          for (let k = 0; k < 4; k++) {
            const dx = CX[k] * hw, dy = CY[k] * hh, p = o + k * 8;
            v[p] = x + dx * c - dy * sn; v[p + 1] = y + dx * sn + dy * c;
            v[p + 2] = ux + (CX[k] > 0 ? uw : 0); v[p + 3] = uy + (CY[k] > 0 ? uh : 0);
            v[p + 4] = r; v[p + 5] = g; v[p + 6] = b; v[p + 7] = al;
          }
          nq++;
        }
        if (pass === 0) nNormal = nq;
      }
      if (!nq) return;
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, v.subarray(0, nq * 32));
      gl.bindTexture(gl.TEXTURE_2D, this.tAtlas);
      gl.uniform1f(this.uW, 1);
      gl.enable(gl.BLEND);
      if (nNormal) { gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.drawElements(gl.TRIANGLES, nNormal * 6, gl.UNSIGNED_SHORT, 0); }
      if (nq > nNormal) { gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.drawElements(gl.TRIANGLES, (nq - nNormal) * 6, gl.UNSIGNED_SHORT, nNormal * 12); }
    }
    draw() {
      this.gl.viewport(0, 0, 640, 480);
      if (!this.layers) return this.full(this.tPlain, 0, false);
      this.full(this.tBg, 0, false);
      this.particles();
      this.full(this.tMenu, 1, true);
    }
  }

  /* --------------------------- full speed: Zappo runs natively (Termux) */
  /* zappo-tablet serves this page and streams the picture over a WebSocket
     (see plat_tablet.c: 'G' 'B' 'M' 'P' 'S' pictures, "L n" layers), "A" +
     sound; text: "t tab music median p95 n", "l command" (a game was chosen),
     "g playing|failed<TAB>name<TAB>core<TAB>why" (Android: it went to
     RetroArch), "a rate ch", "b level", "q". This page answers "d N" once
     it has drawn N pictures. */
  class NativeEngine {
    constructor() {
      this.running = false; this.frameMs = []; this.stats = null; this._tab = 2; this._music = 0;
      this.unacked = 0; this.dirty = false;
      try { this.glv = new GLScreen($("screen")); } catch (e) { this.glv = null; console.warn("WebGL:", e && e.message); }
      if (!this.glv) {
        this.ctx = $("screen").getContext("2d", { alpha: false });
        this.img = this.ctx.createImageData(640, 480);
        this.px = new Uint32Array(this.img.data.buffer);
      }
    }
    connect() {
      const ws = new WebSocket("ws://" + location.host + "/ws");
      ws.binaryType = "arraybuffer";
      this.ws = ws;
      ws.onopen = () => { this.running = true; ovl.hidden = true; ovlAction = null; playing = false; this.unacked = 0; ws.send("gl " + (this.glv ? 1 : 0)); ws.send("full"); for (const [b, set] of held) if (set.size) this.key(b, 1); };
      ws.onclose = () => {
        this.running = false;
        if (ovl.hidden || !ovlAction) { ovl.hidden = false; ovl.firstElementChild.innerHTML = '<div><h2>Zappo X isn\'t running</h2><p>Open <b>Termux</b> once: it starts Zappo X by itself.<br>Then come back here; this connects on its own.</p><p style="margin-top:14px;font-size:13px">(Or in Termux: <code>sh ~/zappo-x/tablet/run.sh</code>)</p></div>'; }
        setTimeout(() => this.connect(), 2000);
      };
      ws.onmessage = (e) => {
        if (typeof e.data === "string") return this.text(e.data);
        const u8 = new Uint8Array(e.data);
        if (u8[0] === 65) {            /* A: sound */
          const pcm = new Int16Array(e.data.slice(1, 1 + ((u8.length - 1) & ~1)));
          sound.push(pcm, pcm.length / sound.ch);
          return;
        }
        this.unacked++;
        this.dirty = true;
        if (this.glv) return this.glv.message(e.data);
        if (u8[0] === 71) {            /* G, without WebGL: rows y0..y1 */
          const dv = new DataView(e.data), y0 = dv.getUint16(2, true), y1 = dv.getUint16(4, true);
          const n = (y1 - y0 + 1) * 640;
          const src = new Uint16Array(e.data, 6, n);
          const px = this.px, o = y0 * 640;
          for (let i = 0; i < n; i++) {
            const v = src[i];
            const r = (v >> 11) & 31, g = (v >> 5) & 63, b = v & 31;
            px[o + i] = 0xff000000 | (((b << 3) | (b >> 2)) << 16) | (((g << 2) | (g >> 4)) << 8) | ((r << 3) | (r >> 2));
          }
          this.ctx.putImageData(this.img, 0, 0, 0, y0, 640, y1 - y0 + 1);
        }
      };
    }
    text(m) {
      const [k, ...rest] = m.split(" ");
      if (k === "t") {
        const [tab, music, med, p95, n] = rest.map(Number);
        this._tab = tab; this._music = music; this.stats = { med, p95, n };
      } else if (k === "L") { if (this.glv) this.glv.layers = +rest[0]; this.dirty = true; }
      else if (k === "l") { showLaunch(m.slice(2), () => this.ws.send("back")); }
      else if (k === "g") { showPlaying(m.slice(2).split("\t"), () => { if (this.running) this.ws.send("back"); }); }
      else if (k === "a") { if (rest[0] === "end") sound.stop(false); else { sound.wake(); sound.open(+rest[0], +rest[1]); } }
      else if (k === "b") { const lv = +rest[0]; $("screen").style.filter = lv <= 0 ? "brightness(0)" : `brightness(${(0.35 + lv * 0.065).toFixed(2)})`; }
      else if (k === "q") { ovl.hidden = false; ovl.firstElementChild.innerHTML = '<div><h2>Zappo closed</h2></div>'; }
    }
    frame() {	/* once a screen refresh: draw what came, and say so */
      if (this.dirty && this.glv) this.glv.draw();
      this.dirty = false;
      if (this.unacked && this.running) { this.ws.send("d " + this.unacked); this.unacked = 0; }
      return true;
    }
    key(b, down) { if (this.running) this.ws.send(`k ${b} ${down ? 1 : 0}`); }
    tab() { return this._tab; }
    musicPlaying() { return this._music; }
  }

  /* ------------------------------------------------------- run */
  const NATIVE = !!window.ZAPPO_NATIVE;
  let wasm = null, benchUntil = 0, benchHold = 0;
  async function boot() {
    if (NATIVE) { if (!z) { z = new NativeEngine(); z.connect(); } return; }
    z = new Zappo({
      fs, canvas: $("screen"), sound,
      hooks: {
        battery: () => battery.level, charging: () => battery.charging,
        brightness: (lv) => { $("screen").style.filter = lv <= 0 ? "brightness(0)" : `brightness(${(0.35 + lv * 0.065).toFixed(2)})`; },
        describe: () => `Browser: ${navigator.userAgent.match(/(Chrome|Firefox|Safari)\/[\d.]+/)?.[0] || "unknown"}\nCPU threads: ${navigator.hardwareConcurrency || "?"}`,
        power: () => { ovl.hidden = false; ovl.firstElementChild.innerHTML = '<div><h2>Switched off</h2><p>On the handheld, this powers off.</p><button class="go">Switch on</button></div>'; ovlAction = async () => { ovlAction = null; ovl.hidden = true; await boot(); }; ovl.querySelector(".go").onclick = () => ovlAction(); },
      },
    });
    await z.load(wasm);
    await z.start();
    for (const [b, set] of held) if (set.size) z.key(b, 1);
  }
  const battery = { level: 76, charging: 0 };
  try { navigator.getBattery && navigator.getBattery().then((b) => { const u = () => { battery.level = Math.round(b.level * 100); battery.charging = b.charging ? 1 : 0; }; u(); b.onlevelchange = b.onchargingchange = u; }).catch(() => {}); } catch (e) {}

  let lastSave = 0, fpsT = 0, fpsN = 0;
  function loop(t) {
    pollPads();
    keyWatch(t);
    if (z && z.running) {
      if (!z.frame()) {
        persist();
        if (z.state === 1 /* UI_LAUNCH */) showLaunch(z.launched || "");
        else if (!ovlAction) { ovl.hidden = false; ovl.firstElementChild.innerHTML = '<div><h2>Zappo closed</h2><button class="go">Start again</button></div>'; ovlAction = async () => { ovlAction = null; ovl.hidden = true; await boot(); }; ovl.querySelector(".go").onclick = () => ovlAction(); }
      }
      const tab = z.tab();
      lights(SECTION[tab] || SECTION[2], t, tab === 3 && z.musicPlaying());
    }
    if (t - lastSave > 3000) { lastSave = t; persist(); }
    fpsN++;
    if (t - fpsT > 1000 && z && t > benchHold) {
      const ms = z.frameMs.slice(-120).sort((a, b) => a - b);
      const med = NATIVE ? (z.stats ? z.stats.med : 0) : ms.length ? ms[ms.length >> 1] : 0;
      speed.textContent = benchUntil > t ? "speed test…" : NATIVE ? `full speed · draw ${med.toFixed(1)} ms` : `${Math.round((fpsN * 1000) / (t - fpsT))} fps · draw ${med.toFixed(1)} ms`;
      fpsT = t; fpsN = 0;
    }
    if (benchUntil && t > benchUntil) finishBench();
    requestAnimationFrame(loop);
  }

  /* speed test: a fixed tour of the menus while timing every picture */
  const TOUR = [9, 9, 9, 9, 8, 8, 8, 8, 3, 3, 3, 1, 1, 0, 9, 9, 1, 1, 1, 0, 0, 8, 8, 3, 3, 2, 2];
  let tourTimer = null;
  $("bench").onclick = () => {
    if (!z || !z.running) return;
    z.frameMs.length = 0;
    if (NATIVE) z.ws.send("reset");
    benchUntil = performance.now() + TOUR.length * 380 + 600;
    let i = 0;
    clearInterval(tourTimer);
    tourTimer = setInterval(() => {
      if (i >= TOUR.length) { clearInterval(tourTimer); return; }
      const b = TOUR[i++]; z.key(b, 1); setTimeout(() => z.key(b, 0), 90);
    }, 380);
  };
  function finishBench() {
    benchUntil = 0;
    benchHold = performance.now() + 30000;   /* keep the result up for a while */
    if (NATIVE) {
      const st = z.stats;
      if (st && st.n) speed.textContent = `full-speed test: ${st.n} pictures · median ${st.med.toFixed(1)} ms · slowest 5% ${st.p95.toFixed(1)} ms`;
      return;
    }
    const ms = z.frameMs.slice().sort((a, b) => a - b);
    if (!ms.length) return;
    const med = ms[ms.length >> 1], p95 = ms[Math.floor(ms.length * 0.95)];
    speed.textContent = `test: ${ms.length} pictures · median ${med.toFixed(1)} ms · slowest 5% ${p95.toFixed(1)} ms`;
  }

  /* the tablet: Zappo X as an app - an icon on the home screen that opens
     full screen, and opens even before Zappo X itself is running */
  if (NATIVE) {
    document.title = "Zappo X";
    const brand = document.querySelector(".brand");
    if (brand) brand.innerHTML = "Zappo <b>X</b>";
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    let installEv = null;
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEv = e; $("install").hidden = false; });
    addEventListener("appinstalled", () => { $("install").hidden = true; installEv = null; });
    $("install").onclick = async () => { if (!installEv) return; installEv.prompt(); try { await installEv.userChoice; } catch (e) {} installEv = null; $("install").hidden = true; };
  }

  $("full").onclick = () => { const d = document.documentElement; try { (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch?.(() => {}); } catch (e) {} };

  (async () => {
    if (NATIVE) { await boot(); requestAnimationFrame(loop); return; }
    try {
      const [w] = await Promise.all([
        fetchBytes("zappo.wasm"),
        loadCard((f) => { $("ovlbar").style.width = (f * 100).toFixed(0) + "%"; }),
      ]);
      wasm = w;
      restore();
      await boot();
      ovl.hidden = true;
      requestAnimationFrame(loop);
    } catch (e) {
      ovlmsg.innerHTML = "Zappo X couldn't start in this browser.<br><code>" + esc(e && e.message || e) + "</code>";
      console.error(e);
    }
  })();
})();
</script>
