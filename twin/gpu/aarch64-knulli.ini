# meson cross file: build for Knulli on the RG40XX H (ARM64, glibc 2.40, GCC 13 C++)
[constants]
sysroot = '/home/claude/twin/sysroot'
common = ['--target=aarch64-linux-gnu', '--sysroot=' + sysroot, '-mcpu=cortex-a53']

[binaries]
c = ['clang'] + common
cpp = ['clang++'] + common
c_ld = 'lld'
cpp_ld = 'lld'
ar = 'llvm-ar'
nm = 'llvm-nm'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/share/pkgconfig'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
